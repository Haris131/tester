name: Build OpenCode for Android

on:
  workflow_dispatch:
    inputs:
      opencode_ref:
        description: Upstream branch/tag
        required: false
        default: dev
      opencode_version:
        description: Version tag for output
        required: false
        default: ''

env:
  BUN_ANDROID_URL: https://github.com/Haris131/opencode-termux/releases/download/v1.17.10/bun

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true

      - name: Prepare dirs
        run: mkdir -p out/bundle out/build

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone OpenCode
        run: git clone --depth 1 --branch dev https://github.com/anomalyco/opencode.git out/build/opencode-source

      - name: Build OpenCode
        run: |
          cd out/build/opencode-source
          bun install
          cd packages/opencode
          bun run build --target=linux-arm64 2>&1
          echo "=== Looking for arm64 binary ==="
          BIN=$(find dist -name 'opencode' -type f -path '*linux-arm64*' | head -1)
          if [ -n "$BIN" ]; then
            echo "Found binary: $BIN"
            cp "$BIN" $GITHUB_WORKSPACE/out/bundle/opencode-linux-arm64
          else
            echo "No arm64 binary found, listing all:"
            find dist -name 'opencode' -type f
          fi

      - name: Download Android Bun
        run: |
          curl -fL ${{ env.BUN_ANDROID_URL }} -o out/bundle/bun-android-arm64
          chmod +x out/bundle/bun-android-arm64

      - name: Package
        run: |
          mkdir -p out/package
          cd out/package
          if [ -f $GITHUB_WORKSPACE/out/bundle/opencode-linux-arm64 ]; then
            cp $GITHUB_WORKSPACE/out/bundle/opencode-linux-arm64 ./opencode
            chmod +x ./opencode
          fi
          cp $GITHUB_WORKSPACE/out/bundle/bun-android-arm64 ./bun
          chmod +x ./bun
          echo '#!/data/data/com.termux/files/usr/bin/bash' > opencode-wrapper.sh
          echo 'DIR="$(cd "$(dirname "$0")" && pwd)"' >> opencode-wrapper.sh
          echo 'exec "$DIR/bun" run "$DIR/opencode" "$@"' >> opencode-wrapper.sh
          chmod +x opencode-wrapper.sh
          cd $GITHUB_WORKSPACE/out
          zip -r opencode-android-arm64.zip package/
          ls -lh opencode-android-arm64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-aarch64
          path: out/opencode-android-arm64.zip
          retention-days: 30
