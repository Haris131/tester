name: Build OpenCode for Android

on:
  workflow_dispatch:
    inputs:
      opencode_ref:
        description: Upstream branch/tag
        required: false
        default: dev

env:
  BUN_ANDROID_URL: https://github.com/Haris131/opencode-termux/releases/download/v1.17.10/bun

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support binutils-aarch64-linux-gnu
          sudo update-binfmts --enable qemu-aarch64 2>/dev/null || true

      - name: Prepare dirs
        run: mkdir -p out/bundle out/build

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone OpenCode
        run: git clone --depth 1 --branch dev https://github.com/anomalyco/opencode.git out/build/opencode-source

      - name: Build OpenCode (musl)
        run: |
          cd out/build/opencode-source
          bun install
          cd packages/opencode
          bun run build 2>&1
          echo "=== Ambil binary musl ==="
          BIN=$(find dist -name 'opencode' -type f -path '*linux-arm64-musl*' | head -1)
          if [ -n "$BIN" ]; then
            echo "Musl binary: $BIN"
            cp "$BIN" $GITHUB_WORKSPACE/out/bundle/opencode
            echo "FILE_INFO:"
            file "$BIN"
            echo "DYNAMIC_DEPS:"
            readelf -d "$BIN" | grep NEEDED || echo "(static - no dynamic deps)"
            echo "SECTIONS:"
            readelf -S "$BIN" | grep -E "(\.text|\.data|\.bss|interp)"
          else
            echo "Musl binary tidak ditemukan, coba yang lain:"
            find dist -name 'opencode' -type f
          fi

      - name: Download Android Bun
        run: |
          curl -fL ${{ env.BUN_ANDROID_URL }} -o out/bundle/bun
          chmod +x out/bundle/bun

      - name: Try run via QEMU
        run: |
          if [ -f out/bundle/opencode ]; then
            echo "=== Mencoba QEMU ==="
            chmod +x out/bundle/opencode
            qemu-aarch64-static out/bundle/opencode --version 2>&1 || echo "QEMU test skipped/failed"
          fi

      - name: Package
        run: |
          cd $GITHUB_WORKSPACE/out
          zip -j opencode-android-arm64.zip bundle/*
          ls -lh opencode-android-arm64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-android-aarch64
          path: out/opencode-android-arm64.zip
          retention-days: 30
