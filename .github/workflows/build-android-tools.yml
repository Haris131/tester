name: Build Android Tools

on:
  push:
    branches: [ libernet-android ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: r23b
  OPENSSL_VERSION: 3.6.3
  CACHE_PREFIX: v1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 19
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi19
            host: arm-linux-androideabi
            openssl_target: linux-armv4
            goarch: arm
            goarm: 7
          - api: 21
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi21
            host: arm-linux-androideabi
            openssl_target: linux-armv4
            goarch: arm
            goarm: 7
          - api: 21
            abi: arm64-v8a
            cc_target: aarch64-linux-android21
            host: aarch64-linux-android
            openssl_target: linux-aarch64
            goarch: arm64
            goarm: ''
          - api: 24
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi24
            host: arm-linux-androideabi
            openssl_target: linux-armv4
            goarch: arm
            goarm: 7
          - api: 24
            abi: arm64-v8a
            cc_target: aarch64-linux-android24
            host: aarch64-linux-android
            openssl_target: linux-aarch64
            goarch: arm64
            goarm: ''

    steps:
      - uses: actions/checkout@v6

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Export toolchain vars
        run: |
          NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_BIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "CC=$NDK_BIN/${{ matrix.cc_target }}-clang" >> $GITHUB_ENV
          echo "AR=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$NDK_BIN/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$NDK_BIN/llvm-strip" >> $GITHUB_ENV
          echo "CFLAGS=-D__ANDROID_API__=${{ matrix.api }} -fPIE -fPIC" >> $GITHUB_ENV
          echo "LDFLAGS=-fPIE -pie" >> $GITHUB_ENV
          echo "DEPS_DIR=$GITHUB_WORKSPACE/deps/${{ matrix.cc_target }}" >> $GITHUB_ENV
          echo "API=${{ matrix.api }}" >> $GITHUB_ENV
          echo "ABI=${{ matrix.abi }}" >> $GITHUB_ENV
          echo "HOST=${{ matrix.host }}" >> $GITHUB_ENV
          echo "CC_TARGET=${{ matrix.cc_target }}" >> $GITHUB_ENV
          echo "OPENSSL_TARGET=${{ matrix.openssl_target }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV
          echo "GOARM=${{ matrix.goarm }}" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=android-tools-${{ matrix.cc_target }}" >> $GITHUB_ENV
          echo "SCRIPTS_DIR=$GITHUB_WORKSPACE/scripts" >> $GITHUB_ENV
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

      - name: Fix NDK symlinks
        run: |
          for f in "$NDK_BIN"/*; do
            if [ -L "$f" ] && [ ! -e "$f" ]; then
              target=$(readlink "$f")
              base=$(basename "$target")
              if [ -n "$base" ]; then
                real=$(find "$NDK_ROOT" -name "$base" -type f 2>/dev/null | head -1)
                if [ -n "$real" ]; then
                  rm -f "$f" && ln -sf "$real" "$f"
                elif [ -x "$NDK_BIN/$base" ]; then
                  rm -f "$f" && ln -sf "$NDK_BIN/$base" "$f"
                fi
              fi
            fi
          done
          ln -sf $CC_TARGET-clang "$NDK_BIN/$HOST-clang" 2>/dev/null || true
          ln -sf $CC_TARGET-clang++ "$NDK_BIN/$HOST-clang++" 2>/dev/null || true

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: deps/${{ matrix.cc_target }}
          key: ${{ env.CACHE_PREFIX }}-deps-${{ matrix.cc_target }}

      - name: Build OpenSSL
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash $SCRIPTS_DIR/build-openssl.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build v2ray-core
        run: bash $SCRIPTS_DIR/build-v2ray.sh

      - name: Build openvpn-openssl
        run: bash $SCRIPTS_DIR/build-openvpn.sh

      - name: Build vnstat
        run: bash $SCRIPTS_DIR/build-vnstat.sh

      - name: Build ttyd
        run: bash $SCRIPTS_DIR/build-ttyd.sh

      - name: Package
        run: |
          cd "$GITHUB_WORKSPACE/artifacts"
          ls -lh
          tar czf "$GITHUB_WORKSPACE/${ARTIFACT_NAME}.tar.gz" *

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz

  release:
    needs: [build]
    if: github.ref == 'refs/heads/libernet-android' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: android-tools-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: android-tools-build${{ github.run_number }}
          name: "Android Tools (build ${{ github.run_number }})"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            android-tools-*.tar.gz
