name: Build PHP 8 for Android

on:
  push:
    branches: [ libernet-android ]
  workflow_dispatch:

env:
  NDK_VERSION: r23b
  ZLIB_VERSION: 1.3.1
  YAML_VERSION: 0.2.5
  PHP_VERSION: 8.3.8
  CACHE_PREFIX: v1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 19
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi19
            openssl_target: linux-armv4
            openssl_version: 1.1.1w
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 21
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi21
            openssl_target: linux-armv4
            openssl_version: 1.1.1w
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 21
            abi: arm64-v8a
            cc_target: aarch64-linux-android21
            openssl_target: linux-aarch64
            openssl_version: 1.1.1w
            host: aarch64-linux-android
            goarch: arm64
            goarm: ''
          - api: 24
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi24
            openssl_target: linux-armv4
            openssl_version: 3.6.3
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 24
            abi: arm64-v8a
            cc_target: aarch64-linux-android24
            openssl_target: linux-aarch64
            openssl_version: 3.6.3
            host: aarch64-linux-android
            goarch: arm64
            goarm: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Fix NDK symlinks
        run: |
          NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_BIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          for f in "$NDK_BIN"/*; do
            if [ -L "$f" ] && [ ! -e "$f" ]; then
              target=$(readlink "$f")
              base=$(basename "$target")
              if [ -n "$base" ]; then
                real=$(find "$NDK_ROOT" -name "$base" -type f 2>/dev/null | head -1)
                if [ -n "$real" ]; then
                  rm -f "$f" && ln -sf "$real" "$f"
                elif [ -x "$NDK_BIN/$base" ]; then
                  rm -f "$f" && ln -sf "$NDK_BIN/$base" "$f"
                fi
              fi
            fi
          done
          ln -sf ${{ matrix.cc_target }}-clang "$NDK_BIN/${{ matrix.host }}-clang" 2>/dev/null || true
          ln -sf ${{ matrix.cc_target }}-clang++ "$NDK_BIN/${{ matrix.host }}-clang++" 2>/dev/null || true

      - name: Export toolchain
        run: |
          NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_BIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "CC=$NDK_BIN/${{ matrix.cc_target }}-clang" >> $GITHUB_ENV
          echo "AR=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$NDK_BIN/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$NDK_BIN/llvm-strip" >> $GITHUB_ENV
          echo "CFLAGS=-D__ANDROID_API__=${{ matrix.api }} -D__sentinel__=__sentinel__ -D__bounded__=__bounded__ -D__nonnull__=__nonnull__ -fPIE -fPIC" >> $GITHUB_ENV
          echo "LDFLAGS=-fPIE -pie" >> $GITHUB_ENV
          echo "DEPS_DIR=$GITHUB_WORKSPACE/deps/${{ matrix.cc_target }}" >> $GITHUB_ENV

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps/${{ matrix.cc_target }}
          key: ${{ env.CACHE_PREFIX }}-php8-${{ matrix.openssl_version }}-${{ matrix.cc_target }}

      - name: Build zlib
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/madler/zlib/archive/refs/tags/v${{ env.ZLIB_VERSION }}.tar.gz -O zlib-${{ env.ZLIB_VERSION }}.tar.gz
          tar xzf zlib-${{ env.ZLIB_VERSION }}.tar.gz
          cd zlib-${{ env.ZLIB_VERSION }}
          CHOST=${{ matrix.host }} \
          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          ./configure --prefix="$DEPS_DIR/zlib" --static
          make -j$(nproc)
          make install

      - name: Build OpenSSL ${{ matrix.openssl_version }}
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://www.openssl.org/source/openssl-${{ matrix.openssl_version }}.tar.gz
          tar xzf openssl-${{ matrix.openssl_version }}.tar.gz
          cd openssl-${{ matrix.openssl_version }}
          export PATH="$NDK_BIN:$PATH"
          export CC="$CC"
          export AR="$AR"
          export RANLIB="$RANLIB"
          OPENSSL_OPTS="no-shared no-asm no-engine"
          if [ "${{ matrix.openssl_version }}" = "1.1.1w" ]; then
            OPENSSL_OPTS="$OPENSSL_OPTS no-hw"
          fi
          ./Configure ${{ matrix.openssl_target }} \
            --prefix="$DEPS_DIR/openssl" \
            $OPENSSL_OPTS \
            -D__ANDROID_API__=${{ matrix.api }} \
            -DOPENSSL_NO_SECURE_MEMORY
          make -j$(nproc)
          make install_sw

      - name: Build libyaml ${{ env.YAML_VERSION }}
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/yaml/libyaml/releases/download/${{ env.YAML_VERSION }}/yaml-${{ env.YAML_VERSION }}.tar.gz
          tar xzf yaml-${{ env.YAML_VERSION }}.tar.gz
          cd yaml-${{ env.YAML_VERSION }}
          ./configure --host=${{ matrix.host }} \
            CC="$CC" \
            CFLAGS="$CFLAGS" \
            --prefix="$DEPS_DIR/yaml" \
            --disable-shared --enable-static
          make -j$(nproc)
          make install

      - name: Build php8
        run: |
          PHP_VER=${{ env.PHP_VERSION }}
          wget -q https://www.php.net/distributions/php-${PHP_VER}.tar.gz
          tar xzf php-${PHP_VER}.tar.gz
          cd php-${PHP_VER}
          export CFLAGS="$CFLAGS -I$DEPS_DIR/openssl/include -I$DEPS_DIR/zlib/include"
          export LDFLAGS="$LDFLAGS -L$DEPS_DIR/openssl/lib -L$DEPS_DIR/zlib/lib"
          ./configure --host=${{ matrix.host }} \
            CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" \
            --disable-all \
            --without-pear --enable-sockets --enable-pcntl \
            --enable-cgi --enable-phpdbg \
            --with-openssl="$DEPS_DIR/openssl" \
            --with-zlib="$DEPS_DIR/zlib" \
            --with-config-file-scan-dir=/data/data/com.termux/files/usr/etc/php.d
          sed -i '/#define HAVE_RES_NSEARCH/d;/#define HAVE___RES_NSEARCH/d' main/php_config.h
          sed -i '/#define HAVE_DN_SKIPNAME/d;/#define HAVE___DN_SKIPNAME/d' main/php_config.h
          cat > php-stubs.c << 'STUBEOF'
          #include <stddef.h>
          #include <wchar.h>
          #include <string.h>
          #include <unistd.h>
          #include <locale.h>
          int mblen(const char *s, size_t n) {
            static mbstate_t _ms;
            if (!s) { memset(&_ms, 0, sizeof(_ms)); return 0; }
            return mbrlen(s, n, &_ms);
          }
          int getdtablesize(void) { return sysconf(_SC_OPEN_MAX); }
          struct lconv *localeconv(void) { static struct lconv _lc; return &_lc; }
          void zif_dns_get_record(void *d, void *rv) { }
          void zif_dns_get_mx(void *d, void *rv) { }
          STUBEOF
          $CC $CFLAGS -c -o php-stubs.o php-stubs.c
          make -j$(nproc) EXTRA_LDFLAGS="$PWD/php-stubs.o" || \
          make -j$(nproc) EXTRA_LIBS="$PWD/php-stubs.o $DEPS_DIR/openssl/lib/libssl.a $DEPS_DIR/openssl/lib/libcrypto.a $DEPS_DIR/zlib/lib/libz.a -lm -ldl"
          $STRIP sapi/cli/php || true
          $STRIP sapi/cgi/php-cgi 2>/dev/null || true
          $STRIP sapi/phpdbg/phpdbg 2>/dev/null || true
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp sapi/cli/php $GITHUB_WORKSPACE/artifacts/php8 2>/dev/null || true
          cp sapi/cgi/php-cgi $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp sapi/phpdbg/phpdbg $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cd $GITHUB_WORKSPACE/artifacts
          ls -lh
          tar czf $GITHUB_WORKSPACE/php8-${{ matrix.cc_target }}.tar.gz *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: php8-${{ matrix.cc_target }}
          path: php8-${{ matrix.cc_target }}.tar.gz
