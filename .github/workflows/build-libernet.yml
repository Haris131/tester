name: Build Libernet for Android

on:
  push:
    branches: [ libernet-android ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: r23b
  ZLIB_VERSION: 1.3.1
  SSH_VERSION: 9.9p1
  BADVPN_VERSION: 1.999.130
  STUNNEL_VERSION: 5.78
  GETDNS_VERSION: v1.7.3
  YAML_VERSION: 0.2.5
  JQ_VERSION: 1.8.1
  CURL_VERSION: 7.88.1
  HTTPING_VERSION: 3.5
  BASH_VER: 5.2.37
  PHP_VERSION: 8.3.8
  CACHE_PREFIX: v1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 19
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi19
            openssl_target: linux-armv4
            openssl_version: 1.1.1w
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 21
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi21
            openssl_target: linux-armv4
            openssl_version: 1.1.1w
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 21
            abi: arm64-v8a
            cc_target: aarch64-linux-android21
            openssl_target: linux-aarch64
            openssl_version: 1.1.1w
            host: aarch64-linux-android
            goarch: arm64
            goarm: ''
          - api: 24
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi24
            openssl_target: linux-armv4
            openssl_version: 3.6.3
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 24
            abi: arm64-v8a
            cc_target: aarch64-linux-android24
            openssl_target: linux-aarch64
            openssl_version: 3.6.3
            host: aarch64-linux-android
            goarch: arm64
            goarm: ''

    steps:
      - uses: actions/checkout@v6

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Export toolchain & matrix vars
        run: |
          NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_BIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "CC=$NDK_BIN/${{ matrix.cc_target }}-clang" >> $GITHUB_ENV
          echo "AR=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$NDK_BIN/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$NDK_BIN/llvm-strip" >> $GITHUB_ENV
          echo "CFLAGS=-D__ANDROID_API__=${{ matrix.api }} -D__sentinel__=__sentinel__ -D__bounded__=__bounded__ -D__nonnull__=__nonnull__ -fPIE -fPIC" >> $GITHUB_ENV
          echo "LDFLAGS=-fPIE -pie" >> $GITHUB_ENV
          echo "DEPS_DIR=$GITHUB_WORKSPACE/deps/${{ matrix.cc_target }}" >> $GITHUB_ENV
          echo "API=${{ matrix.api }}" >> $GITHUB_ENV
          echo "ABI=${{ matrix.abi }}" >> $GITHUB_ENV
          echo "HOST=${{ matrix.host }}" >> $GITHUB_ENV
          echo "CC_TARGET=${{ matrix.cc_target }}" >> $GITHUB_ENV
          echo "OPENSSL_TARGET=${{ matrix.openssl_target }}" >> $GITHUB_ENV
          echo "OPENSSL_VERSION=${{ matrix.openssl_version }}" >> $GITHUB_ENV
          echo "GOARCH=${{ matrix.goarch }}" >> $GITHUB_ENV
          echo "GOARM=${{ matrix.goarm }}" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=libernet-tools-${{ matrix.cc_target }}" >> $GITHUB_ENV
          echo "SCRIPTS_DIR=$GITHUB_WORKSPACE/scripts" >> $GITHUB_ENV
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

      - name: Fix NDK symlinks
        run: |
          for f in "$NDK_BIN"/*; do
            if [ -L "$f" ] && [ ! -e "$f" ]; then
              target=$(readlink "$f")
              base=$(basename "$target")
              if [ -n "$base" ]; then
                real=$(find "$NDK_ROOT" -name "$base" -type f 2>/dev/null | head -1)
                if [ -n "$real" ]; then
                  rm -f "$f" && ln -sf "$real" "$f"
                elif [ -x "$NDK_BIN/$base" ]; then
                  rm -f "$f" && ln -sf "$NDK_BIN/$base" "$f"
                fi
              fi
            fi
          done
          ln -sf $CC_TARGET-clang "$NDK_BIN/$HOST-clang" 2>/dev/null || true
          ln -sf $CC_TARGET-clang++ "$NDK_BIN/$HOST-clang++" 2>/dev/null || true

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: deps/${{ matrix.cc_target }}
          key: ${{ env.CACHE_PREFIX }}-deps-${{ matrix.openssl_version }}-${{ matrix.cc_target }}

      - name: Build zlib
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash $SCRIPTS_DIR/build-zlib.sh

      - name: Build OpenSSL ${{ matrix.openssl_version }}
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash $SCRIPTS_DIR/build-openssl.sh

      - name: Build libyaml ${{ env.YAML_VERSION }}
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bash $SCRIPTS_DIR/build-libyaml.sh

      - name: Build sshpass
        run: bash $SCRIPTS_DIR/build-sshpass.sh

      - name: Install NSS/NSPR headers
        run: bash $SCRIPTS_DIR/install-nss-nspr.sh

      - name: Build badvpn-tun2socks
        run: bash $SCRIPTS_DIR/build-badvpn-tun2socks.sh

      - name: Build jq
        run: bash $SCRIPTS_DIR/build-jq.sh

      - name: Build curl
        run: bash $SCRIPTS_DIR/build-curl.sh

      - name: Build libxml2
        run: bash $SCRIPTS_DIR/build-libxml2.sh

      - name: Build libzip
        run: bash $SCRIPTS_DIR/build-libzip.sh

      - name: Build httping
        run: bash $SCRIPTS_DIR/build-httping.sh

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build bash
        run: bash $SCRIPTS_DIR/build-bash.sh

      - name: Build dnstt-client
        run: bash $SCRIPTS_DIR/build-dnstt-client.sh

      - name: Build go-tcp-proxy-tunnel
        run: bash $SCRIPTS_DIR/build-go-tcp-proxy-tunnel.sh

      - name: Build v2ray-core
        run: bash $SCRIPTS_DIR/build-v2ray.sh

      - name: Build corkscrew
        run: bash $SCRIPTS_DIR/build-corkscrew.sh

      - name: Build OpenSSH client
        run: bash $SCRIPTS_DIR/build-openssh.sh

      - name: Build stunnel
        run: bash $SCRIPTS_DIR/build-stunnel.sh

      - name: Build tun2socks-udprelay
        run: bash $SCRIPTS_DIR/build-tun2socks-udprelay.sh

      - name: Build stubby
        run: bash $SCRIPTS_DIR/build-stubby.sh

      - name: Build php8
        run: bash $SCRIPTS_DIR/build-php8.sh

      - name: Build openvpn
        run: bash $SCRIPTS_DIR/build-openvpn.sh

      - name: Build vnstat
        run: bash $SCRIPTS_DIR/build-vnstat.sh

      - name: Build ttyd
        run: bash $SCRIPTS_DIR/build-ttyd.sh

      - name: Package
        run: bash $SCRIPTS_DIR/package.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz

  release:
    needs: [build]
    if: github.ref == 'refs/heads/libernet-android' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: libernet-tools-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: libernet-android-v1-build${{ github.run_number }}
          name: "Libernet for Android (build ${{ github.run_number }})"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            libernet-tools-*.tar.gz
