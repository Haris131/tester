name: Build Libernet for Android

on:
  push:
    branches: [ libernet-android ]
  workflow_dispatch:

env:
  NDK_VERSION: r23b
  ZLIB_VERSION: 1.3.1
  SSH_VERSION: 9.9p1
  BADVPN_VERSION: 1.999.130
  STUNNEL_VERSION: 5.78
  GETDNS_VERSION: v1.7.3
  YAML_VERSION: 0.2.5
  JQ_VERSION: 1.8.1
  CURL_VERSION: 7.88.1
  HTTPING_VERSION: 3.5
  BASH_VERSION: 5.2.37
  PHP_VERSION: 8.3.8
  PYTHON_VERSION: 3.12.4
  CACHE_PREFIX: v1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 19
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi19
            openssl_target: linux-armv4
            openssl_version: 1.1.1w
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 21
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi21
            openssl_target: linux-armv4
            openssl_version: 1.1.1w
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 21
            abi: arm64-v8a
            cc_target: aarch64-linux-android21
            openssl_target: linux-aarch64
            openssl_version: 1.1.1w
            host: aarch64-linux-android
            goarch: arm64
            goarm: ''
          - api: 24
            abi: armeabi-v7a
            cc_target: armv7a-linux-androideabi24
            openssl_target: linux-armv4
            openssl_version: 3.6.3
            host: arm-linux-androideabi
            goarch: arm
            goarm: 7
          - api: 24
            abi: arm64-v8a
            cc_target: aarch64-linux-android24
            openssl_target: linux-aarch64
            openssl_version: 3.6.3
            host: aarch64-linux-android
            goarch: arm64
            goarm: ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Fix NDK symlinks
        run: |
          NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_BIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          for f in "$NDK_BIN"/*; do
            if [ -L "$f" ] && [ ! -e "$f" ]; then
              target=$(readlink "$f")
              base=$(basename "$target")
              if [ -n "$base" ]; then
                real=$(find "$NDK_ROOT" -name "$base" -type f 2>/dev/null | head -1)
                if [ -n "$real" ]; then
                  rm -f "$f" && ln -sf "$real" "$f"
                elif [ -x "$NDK_BIN/$base" ]; then
                  rm -f "$f" && ln -sf "$NDK_BIN/$base" "$f"
                fi
              fi
            fi
          done
          ln -sf ${{ matrix.cc_target }}-clang "$NDK_BIN/${{ matrix.host }}-clang" 2>/dev/null || true
          ln -sf ${{ matrix.cc_target }}-clang++ "$NDK_BIN/${{ matrix.host }}-clang++" 2>/dev/null || true

      - name: Export toolchain
        run: |
          NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_BIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "NDK_BIN=$NDK_BIN" >> $GITHUB_ENV
          echo "NDK_ROOT=$NDK_ROOT" >> $GITHUB_ENV
          echo "CC=$NDK_BIN/${{ matrix.cc_target }}-clang" >> $GITHUB_ENV
          echo "AR=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$NDK_BIN/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$NDK_BIN/llvm-strip" >> $GITHUB_ENV
          echo "CFLAGS=-D__ANDROID_API__=${{ matrix.api }} -D__sentinel__=__sentinel__ -D__bounded__=__bounded__ -D__nonnull__=__nonnull__ -fPIE -fPIC" >> $GITHUB_ENV
          echo "LDFLAGS=-fPIE -pie" >> $GITHUB_ENV
          echo "DEPS_DIR=$GITHUB_WORKSPACE/deps/${{ matrix.cc_target }}" >> $GITHUB_ENV

      - name: Cache deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps/${{ matrix.cc_target }}
          key: ${{ env.CACHE_PREFIX }}-deps-${{ matrix.openssl_version }}-${{ matrix.cc_target }}

      - name: Build zlib
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/madler/zlib/archive/refs/tags/v${{ env.ZLIB_VERSION }}.tar.gz -O zlib-${{ env.ZLIB_VERSION }}.tar.gz
          tar xzf zlib-${{ env.ZLIB_VERSION }}.tar.gz
          cd zlib-${{ env.ZLIB_VERSION }}
          CHOST=${{ matrix.host }} \
          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          ./configure --prefix="$DEPS_DIR/zlib" --static
          make -j$(nproc)
          make install

      - name: Build OpenSSL ${{ matrix.openssl_version }}
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://www.openssl.org/source/openssl-${{ matrix.openssl_version }}.tar.gz
          tar xzf openssl-${{ matrix.openssl_version }}.tar.gz
          cd openssl-${{ matrix.openssl_version }}
          export PATH="$NDK_BIN:$PATH"
          export CC="$CC"
          export AR="$AR"
          export RANLIB="$RANLIB"
          OPENSSL_OPTS="no-shared no-asm no-engine"
          if [ "${{ matrix.openssl_version }}" = "1.1.1w" ]; then
            OPENSSL_OPTS="$OPENSSL_OPTS no-hw"
          fi
          ./Configure ${{ matrix.openssl_target }} \
            --prefix="$DEPS_DIR/openssl" \
            $OPENSSL_OPTS \
            -D__ANDROID_API__=${{ matrix.api }} \
            -DOPENSSL_NO_SECURE_MEMORY
          make -j$(nproc)
          make install_sw

      - name: Build libyaml ${{ env.YAML_VERSION }}
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/yaml/libyaml/releases/download/${{ env.YAML_VERSION }}/yaml-${{ env.YAML_VERSION }}.tar.gz
          tar xzf yaml-${{ env.YAML_VERSION }}.tar.gz
          cd yaml-${{ env.YAML_VERSION }}
          ./configure --host=${{ matrix.host }} \
            CC="$CC" \
            CFLAGS="$CFLAGS" \
            --prefix="$DEPS_DIR/yaml" \
            --disable-shared --enable-static
          make -j$(nproc)
          make install

      - name: Build sshpass
        run: |
          wget -q https://sourceforge.net/projects/sshpass/files/sshpass/1.10/sshpass-1.10.tar.gz
          tar xzf sshpass-1.10.tar.gz
          cd sshpass-1.10
          ./configure --host=${{ matrix.host }} \
            CC="$CC" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            ac_cv_func_malloc_0_nonnull=yes \
            ac_cv_func_realloc_0_nonnull=yes
          make -j$(nproc)
          $STRIP sshpass
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp sshpass $GITHUB_WORKSPACE/artifacts/

      - name: Install NSS/NSPR headers (needed by badvpn cmake)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnspr4-dev libnss3-dev

      - name: Build badvpn-tun2socks
        run: |
          wget -q https://github.com/ambrop72/badvpn/archive/refs/tags/${{ env.BADVPN_VERSION }}.tar.gz -O badvpn.tar.gz
          tar xzf badvpn.tar.gz
          # Make badvpn detect Android as Linux (NDK sets CMAKE_SYSTEM_NAME=Android)
          sed -i 's/elseif (CMAKE_SYSTEM_NAME STREQUAL "Linux")/elseif (CMAKE_SYSTEM_NAME STREQUAL "Linux" OR CMAKE_SYSTEM_NAME STREQUAL "Android")/' badvpn-${{ env.BADVPN_VERSION }}/CMakeLists.txt
          # Android lacks librt; create empty stub so link_libraries(rt) doesn't fail
          mkdir -p $DEPS_DIR
          $AR rcs $DEPS_DIR/librt.a
          cd badvpn-${{ env.BADVPN_VERSION }}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NOTHING_BY_DEFAULT=1 \
            -DBUILD_TUN2SOCKS=1 \
            -DCMAKE_EXE_LINKER_FLAGS="-L$DEPS_DIR"
          make
          TUN=$(find . -name "badvpn-tun2socks" -type f | head -1)
          $STRIP "$TUN"
          cp "$TUN" $GITHUB_WORKSPACE/artifacts/

      - name: Build jq
        run: |
          wget -q https://github.com/jqlang/jq/releases/download/jq-${{ env.JQ_VERSION }}/jq-${{ env.JQ_VERSION }}.tar.gz
          tar xzf jq-${{ env.JQ_VERSION }}.tar.gz
          cd jq-${{ env.JQ_VERSION }}
          ./configure --host=${{ matrix.host }} \
            CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" \
            --disable-docs --disable-maintainer-mode \
            --disable-shared --enable-static \
            --with-oniguruma=builtin
          make -j$(nproc)
          $STRIP jq
          cp jq $GITHUB_WORKSPACE/artifacts/

      - name: Build curl
        run: |
          wget -q https://curl.se/download/curl-${{ env.CURL_VERSION }}.tar.gz
          tar xzf curl-${{ env.CURL_VERSION }}.tar.gz
          cd curl-${{ env.CURL_VERSION }}
          export CFLAGS="$CFLAGS -I$DEPS_DIR/zlib/include -I$DEPS_DIR/openssl/include"
          export LDFLAGS="$LDFLAGS -L$DEPS_DIR/zlib/lib -L$DEPS_DIR/openssl/lib"
          ./configure --host=${{ matrix.host }} \
            CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" \
            --with-openssl="$DEPS_DIR/openssl" \
            --with-zlib="$DEPS_DIR/zlib" \
            --disable-shared --enable-static \
            --disable-docs --disable-manual \
            --without-brotli --without-zstd \
            --without-libpsl \
            --enable-ipv6 --enable-threaded-resolver
          make -j$(nproc)
          $STRIP src/curl
          cp src/curl $GITHUB_WORKSPACE/artifacts/

      - name: Build httping
        run: |
          wget -q https://github.com/folkertvanheusden/httping/archive/refs/tags/v${{ env.HTTPING_VERSION }}.tar.gz -O httping-${{ env.HTTPING_VERSION }}.tar.gz
          tar xzf httping-${{ env.HTTPING_VERSION }}.tar.gz
          HTTPING_DIR=$(ls -d *${{ env.HTTPING_VERSION }}/ | head -1)
          cd "$HTTPING_DIR"
          touch makefile.inc
          printf '%s\n' '#pragma once' '#define HAVE_SSL 1' '#define HAVE_OPENSSL 1' '#define VERSION "${{ env.HTTPING_VERSION }}"' > config.h
          printf '%s\n' '#define gettext(s) s' '#define dgettext(d,s) s' '#define bindtextdomain(d,p)' '#define textdomain(d)' > libintl.h
          printf '%s\n' '#include <openssl/engine.h>' 'void ENGINE_cleanup(void) {}' > stub-engine.c
          export CFLAGS="$CFLAGS -I. -I$DEPS_DIR/openssl/include"
          export LDFLAGS="$LDFLAGS -L$DEPS_DIR/openssl/lib -lssl -lcrypto -lz -ldl ./stub-engine.o"
          $CC $CFLAGS -c -o stub-engine.o stub-engine.c
          make CC="$CC" NO_GETTEXT=yes SSL=yes -j$(nproc)
          $STRIP httping
          cp httping $GITHUB_WORKSPACE/artifacts/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build bash
        run: |
          wget -q https://ftp.gnu.org/gnu/bash/bash-${{ env.BASH_VERSION }}.tar.gz
          tar xzf bash-${{ env.BASH_VERSION }}.tar.gz
          cd bash-${{ env.BASH_VERSION }}
          # Bionic headers declare functions that don't exist before certain API levels
          export ac_cv_func_dprintf=yes
          # mkfifo not in Bionic < API 21; tell configure it exists so bash doesn't redefine it
          export ac_cv_func_mkfifo=yes
          ./configure --host=${{ matrix.host }} \
            CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" \
            --disable-shared --enable-static \
            --without-bash-malloc \
            --disable-readline --disable-history \
            --disable-progcomp --disable-nls
          # Remove bash's dprintf declaration (conflicts with Bionic's int dprintf)
          sed -i '/extern void dprintf/d' externs.h
          # Bionic < API 26 lacks mblen, mbtowc, etc. — provide stubs using mbr* equivalents
          cat > mb-stub.c << 'MBEOF'
          #include <stddef.h>
          #include <wchar.h>
          #include <string.h>
          static mbstate_t _mbst;
          int mblen(const char *s, size_t n) {
            if (s == NULL) { memset(&_mbst, 0, sizeof(_mbst)); return 0; }
            return mbrlen(s, n, &_mbst);
          }
          int mbtowc(wchar_t *pwc, const char *s, size_t n) {
            if (s == NULL) { memset(&_mbst, 0, sizeof(_mbst)); return 0; }
            size_t r = mbrtowc(pwc, s, n, &_mbst);
            return (r == (size_t)-1 || r == (size_t)-2) ? -1 : (int)r;
          }
          int wctomb(char *s, wchar_t wc) {
            if (s == NULL) { memset(&_mbst, 0, sizeof(_mbst)); return 0; }
            size_t r = wcrtomb(s, wc, &_mbst);
            return (r == (size_t)-1) ? -1 : (int)r;
          }
          size_t mbstowcs(wchar_t *pwcs, const char *s, size_t n) {
            mbstate_t st = _mbst;
            return mbsrtowcs(pwcs, (const char **)&s, n, &st);
          }
          size_t wcstombs(char *s, const wchar_t *pwcs, size_t n) {
            mbstate_t st = _mbst;
            return wcsrtombs(s, (const wchar_t **)&pwcs, n, &st);
          }
          MBEOF
          $CC $CFLAGS -c -o mb-stub.o mb-stub.c
          make -j$(nproc) LDFLAGS+=" mb-stub.o"
          $STRIP bash
          cp bash $GITHUB_WORKSPACE/artifacts/

      - name: Build dnstt-client
        run: |
          git clone --depth=1 https://github.com/Haris131/dnstt.git
          cd dnstt
          GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
          CGO_ENABLED=1 GOOS=android CC="$CC" \
          go build -ldflags="-w -s" -o $GITHUB_WORKSPACE/artifacts/dnstt-client ./dnstt-client

      - name: Build go-tcp-proxy-tunnel
        run: |
          git clone --depth=1 https://github.com/lutfailham96/go-tcp-proxy-tunnel.git
          cd go-tcp-proxy-tunnel
          GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} \
          CGO_ENABLED=1 GOOS=android CC="$CC" \
          go build -ldflags="-w -s" -o $GITHUB_WORKSPACE/artifacts/go-tcp-proxy-tunnel ./cmd/tcp-proxy-tunnel/main.go

      - name: Build php8
        run: |
          PHP_VER=${{ env.PHP_VERSION }}
          wget -q https://www.php.net/distributions/php-${PHP_VER}.tar.gz
          tar xzf php-${PHP_VER}.tar.gz
          cd php-${PHP_VER}
          export CFLAGS="$CFLAGS -I$DEPS_DIR/openssl/include -I$DEPS_DIR/zlib/include"
          export LDFLAGS="$LDFLAGS -L$DEPS_DIR/openssl/lib -L$DEPS_DIR/zlib/lib"
          ./configure --host=${{ matrix.host }} \
            CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" \
            --disable-all --disable-cgi --disable-phpdbg \
            --without-pear --enable-sockets --enable-pcntl \
            --with-openssl="$DEPS_DIR/openssl" \
            --with-zlib="$DEPS_DIR/zlib" \
            --with-config-file-scan-dir=/data/data/com.termux/files/usr/etc/php.d
          # Bionic lacks res_n* API and declares incomplete __res_state; disable DNS resolver
          sed -i '/#define HAVE_RES_NSEARCH/d;/#define HAVE___RES_NSEARCH/d' main/php_config.h
          sed -i '/#define HAVE_DN_SKIPNAME/d;/#define HAVE___DN_SKIPNAME/d' main/php_config.h
          # Provide stubs for system+PHP functions undeclared in Bionic libc
          cat > php-stubs.c << 'STUBEOF'
          #include <stddef.h>
          #include <wchar.h>
          #include <string.h>
          #include <unistd.h>
          int mblen(const char *s, size_t n) {
            static mbstate_t _ms;
            if (!s) { memset(&_ms, 0, sizeof(_ms)); return 0; }
            return mbrlen(s, n, &_ms);
          }
          int getdtablesize(void) { return sysconf(_SC_OPEN_MAX); }
          void zif_dns_get_record(void *d, void *rv) { }
          void zif_dns_get_mx(void *d, void *rv) { }
          STUBEOF
          $CC $CFLAGS -c -o php-stubs.o php-stubs.c
          $CC $CFLAGS -c -o php-stubs.o php-stubs.c
          make -j$(nproc) EXTRA_LIBS="php-stubs.o"
          $STRIP sapi/cli/php || true
          cp sapi/cli/php $GITHUB_WORKSPACE/artifacts/php8 2>/dev/null || true

      - name: Build python3
        run: |
          PY_VER=${{ env.PYTHON_VERSION }}
          wget -q https://www.python.org/ftp/python/${PY_VER}/Python-${PY_VER}.tar.xz
          tar xf Python-${PY_VER}.tar.xz
          cd Python-${PY_VER}
          export CFLAGS="$CFLAGS -I$DEPS_DIR/openssl/include -I$DEPS_DIR/zlib/include"
          export LDFLAGS="$LDFLAGS -L$DEPS_DIR/openssl/lib -L$DEPS_DIR/zlib/lib"
          ./configure --host=${{ matrix.host }} \
            CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" \
            --build=x86_64-linux-gnu \
            --disable-ipv6 \
            ac_cv_file__dev_ptmx=no ac_cv_file__dev_ptc=no \
            ac_cv_func_accept=yes
          make -j$(nproc) || true
          $STRIP python || true
          cp python $GITHUB_WORKSPACE/artifacts/python3 2>/dev/null || true

      - name: Build corkscrew
        run: |
          wget -q https://deb.debian.org/debian/pool/main/c/corkscrew/corkscrew_2.0.orig.tar.gz -O corkscrew-2.0.tar.gz 2>&1 || \
          wget -q http://ftp.debian.org/debian/pool/main/c/corkscrew/corkscrew_2.0.orig.tar.gz -O corkscrew-2.0.tar.gz 2>&1 || \
          wget -q http://corkscrew.agroman.net/corkscrew-2.0.tar.gz -O corkscrew-2.0.tar.gz 2>&1
          tar xzf corkscrew-2.0.tar.gz
          cd corkscrew-2.0
          CC="$CC" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS" \
          ac_cv_func_malloc_0_nonnull=yes ac_cv_func_realloc_0_nonnull=yes \
          ./configure --host=${{ matrix.host }}
          make -j$(nproc)
          $STRIP corkscrew
          cp corkscrew $GITHUB_WORKSPACE/artifacts/

      - name: Build OpenSSH client
        run: |
          curl -fSL -o openssh-${{ env.SSH_VERSION }}.tar.gz \
            https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-${{ env.SSH_VERSION }}.tar.gz || \
          curl -fSL -o openssh-${{ env.SSH_VERSION }}.tar.gz \
            https://cloudflare.cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-${{ env.SSH_VERSION }}.tar.gz || \
          curl -fSL -o openssh-${{ env.SSH_VERSION }}.tar.gz \
            https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-${{ env.SSH_VERSION }}.tar.gz
          tar xzf openssh-${{ env.SSH_VERSION }}.tar.gz
          cd openssh-${{ env.SSH_VERSION }}
           # Replace getrrsetbyname.c with stub (Android lacks BSD resolver internals)
            printf '%s\n' '#include "includes.h"' '#if !defined(HAVE_GETRRSETBYNAME) && !defined(HAVE_LDNS)' '#include "getrrsetbyname.h"' 'int getrrsetbyname(const char *hostname, unsigned int rdclass, unsigned int rdtype, unsigned int flags, struct rrsetinfo **res) { return ERRSET_FAIL; }' 'void freerrset(struct rrsetinfo *rrset) { /* no-op */ }' '#endif' > openbsd-compat/getrrsetbyname.c
           sed -i 's|^bzero(void \*b, size_t n)|#ifdef bzero\n#undef bzero\n#endif\nbzero(void *b, size_t n)|' openbsd-compat/bsd-misc.c
            # Provide getifaddrs stub for API < 24 (Android lacks this before API 24)
            printf '%s\n' '#include "includes.h"' \
              '#if defined(__ANDROID_API__) && __ANDROID_API__ < 24' \
              '#include <errno.h>' \
              '#include <sys/socket.h>' \
              'struct ifaddrs {' \
              '    struct ifaddrs *ifa_next;' \
              '    char *ifa_name;' \
              '    unsigned int ifa_flags;' \
              '    struct sockaddr *ifa_addr;' \
              '    struct sockaddr *ifa_netmask;' \
              '    struct sockaddr *ifa_dstaddr;' \
              '    void *ifa_data;' \
              '};' \
              'int getifaddrs(struct ifaddrs **ifap) {' \
              '    *ifap = NULL;' \
              '    errno = ENOSYS;' \
              '    return -1;' \
              '}' \
              'void freeifaddrs(struct ifaddrs *ifa) {' \
              '    (void)ifa;' \
              '}' \
              '#endif' > openbsd-compat/bsd-getifaddrs.c
            export CFLAGS="$CFLAGS -I$DEPS_DIR/zlib/include -I$DEPS_DIR/openssl/include"
           export LDFLAGS="$LDFLAGS -L$DEPS_DIR/zlib/lib -L$DEPS_DIR/openssl/lib -ldl"
           export LIBS="-ldl"
           CC="$CC" \
           CFLAGS="$CFLAGS" \
           LDFLAGS="$LDFLAGS" \
           LIBS="$LIBS" \
           ac_cv_func_getaddrinfo=yes \
           ac_cv_have_int64_t=yes \
           ac_cv_have_u_int64_t=yes \
           ac_cv_have_uint64_t=yes \
           ac_cv_func_getpwnam_r=yes \
           ac_cv_func_getpwuid_r=yes \
           ac_cv_func_getgrgid_r=yes \
           ac_cv_func_getgrnam_r=yes \
           ac_cv_func_clock_gettime=yes \
           ac_cv_func_mmap=yes \
           ac_cv_func_strnlen=yes \
           ac_cv_func_va_copy=yes \
           ac_cv_func_malloc_0_nonnull=yes \
           ac_cv_func_realloc_0_nonnull=yes \
           ac_cv_func_mblen=yes \
            ac_cv_func_getpagesize=yes \
            ac_cv_c___attribute__=yes \
            ./configure --host=${{ matrix.host }} \
             --with-zlib="$DEPS_DIR/zlib" \
             --with-ssl-dir="$DEPS_DIR/openssl" \
             --disable-strip \
             --disable-etc-default-login \
             --disable-lastlog \
             --disable-utmp \
             --disable-utmpx \
             --disable-wtmp \
             --disable-wtmpx \
             --disable-pututline \
             --disable-pututxline \
               --disable-pkcs11
            # Compile getifaddrs stub and add to link via LIBS override
            $CC $CFLAGS -I. -c -o bsd-getifaddrs.o openbsd-compat/bsd-getifaddrs.c
            make -j$(nproc) LIBS="$(sed -n 's/^LIBS=//p' Makefile) $PWD/bsd-getifaddrs.o" ssh scp sftp ssh-keygen ssh-keyscan ssh-keysign
          for f in ssh scp sftp ssh-keygen ssh-keyscan ssh-keysign; do
            [ -f "$f" ] && $STRIP "$f" && cp "$f" $GITHUB_WORKSPACE/artifacts/
          done

      - name: Build stunnel
        run: |
          curl -fSL -o stunnel-${{ env.STUNNEL_VERSION }}.tar.gz \
            https://www.stunnel.org/downloads/stunnel-${{ env.STUNNEL_VERSION }}.tar.gz || \
          curl -fSL -o stunnel-${{ env.STUNNEL_VERSION }}.tar.gz \
            https://www.usenix.org.uk/mirrors/stunnel/archive/5.x/stunnel-${{ env.STUNNEL_VERSION }}.tar.gz || \
          curl -fSL -o stunnel-${{ env.STUNNEL_VERSION }}.tar.gz \
            https://fossies.org/linux/misc/stunnel-${{ env.STUNNEL_VERSION }}.tar.gz
          tar xzf stunnel-${{ env.STUNNEL_VERSION }}.tar.gz
          cd stunnel-${{ env.STUNNEL_VERSION }}
          export CFLAGS="$CFLAGS -I$DEPS_DIR/openssl/include"
          export LDFLAGS="$LDFLAGS -L$DEPS_DIR/openssl/lib -ldl"
          ./configure --host=${{ matrix.host }} \
            CC="$CC" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            --with-ssl="$DEPS_DIR/openssl" \
            --disable-systemd \
            --disable-fips \
            ac_cv_func_malloc_0_nonnull=yes \
            ac_cv_func_realloc_0_nonnull=yes
          make -j$(nproc)
          $STRIP src/stunnel
          cp src/stunnel $GITHUB_WORKSPACE/artifacts/

      - name: Build tun2socks-udprelay (FH0/badvpn fork)
        run: |
          git clone --depth=1 https://github.com/FH0/badvpn.git badvpn-udprelay
          cd badvpn-udprelay
          mkdir -p jni
          sed 's|LOCAL_PATH := \$(call my-dir)|LOCAL_PATH := $(call my-dir)/..|' Android.mk > jni/Android.mk
          cp Application.mk jni/
          $NDK_ROOT/ndk-build NDK_PROJECT_PATH=. \
            APP_ABI=${{ matrix.abi }} \
            APP_PLATFORM=android-${{ matrix.api }}
          find obj -name "tun2socks" -type f -exec $STRIP {} \; -exec mv {} $GITHUB_WORKSPACE/artifacts/badvpn-tun2socks-udprelay \;

      - name: Build stubby
        run: |
          git clone --depth 1 --branch ${{ env.GETDNS_VERSION }} --recurse-submodules https://github.com/getdnsapi/getdns.git getdns-${{ env.GETDNS_VERSION }}
          # Build bsd_signal stub (Android doesn't have bsd_signal)
          cat > bsd_signal_stub.c << 'EOF'
          #include <signal.h>
          void (*bsd_signal(int sig, void (*func)(int)))(int) {
              return signal(sig, func);
          }
          EOF
          $CC -c -o bsd_signal_stub.o bsd_signal_stub.c
          $AR rcs libbsd_signal_stub.a bsd_signal_stub.o
          cd getdns-${{ env.GETDNS_VERSION }}
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${{ matrix.api }} \
            -DANDROID_STL=none \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/stubby-build \
            -DBUILD_STUBBY=ON \
            -DENABLE_STUB_ONLY=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR=$DEPS_DIR/openssl \
            -DOPENSSL_INCLUDE_DIR=$DEPS_DIR/openssl/include \
            -DOPENSSL_CRYPTO_LIBRARY=$DEPS_DIR/openssl/lib/libcrypto.a \
            -DOPENSSL_SSL_LIBRARY=$DEPS_DIR/openssl/lib/libssl.a \
            -DYAML_LIBRARY=$DEPS_DIR/yaml/lib/libyaml.a \
            -DYAML_INCLUDE_DIR=$DEPS_DIR/yaml/include \
            -DUSE_LIBIDN2=OFF \
            -DHAVE_DSA_SIG_SET0=1 \
            -DHAVE_DSA_SET0_PQG=1 \
            -DHAVE_DSA_SET0_KEY=1 \
            -DHAVE_RSA_SET0_KEY=1 \
            -DHAVE_EVP_MD_CTX_NEW=1 \
            -DHAVE_EVP_DIGESTVERIFY=1 \
            -DHAVE_HMAC_CTX_NEW=1 \
            -DHAVE_OPENSSL_VERSION_NUM=1 \
            -DHAVE_OPENSSL_VERSION=1 \
            -DHAVE_SSL_CTX_SET_CIPHERSUITES=1 \
            -DHAVE_SSL_SET_CIPHERSUITES=1 \
            -DCMAKE_EXE_LINKER_FLAGS="-fPIE -pie -ldl $GITHUB_WORKSPACE/libbsd_signal_stub.a" \
            -DCMAKE_FIND_ROOT_PATH="$DEPS_DIR/openssl;$DEPS_DIR/yaml"
          make -j$(nproc)
          make install
          $STRIP $GITHUB_WORKSPACE/stubby-build/bin/stubby
          cp $GITHUB_WORKSPACE/stubby-build/bin/stubby $GITHUB_WORKSPACE/artifacts/

      - name: Package
        run: |
          cd $GITHUB_WORKSPACE/artifacts
          ls -lh
          tar czf $GITHUB_WORKSPACE/libernet-tools-${{ matrix.cc_target }}.tar.gz *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libernet-tools-${{ matrix.cc_target }}
          path: libernet-tools-${{ matrix.cc_target }}.tar.gz
