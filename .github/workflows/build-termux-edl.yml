name: Build Termux EDL
on:
  push:
    branches: [ termux-edl ]
  pull_request:
    branches: [ termux-edl ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_VERSION: "3.62"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - arch: aarch64
            platform: linux/arm64
            deb_arch: arm64
          - arch: arm
            platform: linux/arm/v7
            deb_arch: armhf
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (newer binfmt for better personality() support)
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install arm64,arm

      - uses: actions/checkout@v4
        with:
          repository: Haris131/termux-edl
          ref: termux-edl
          path: edl-src
          submodules: recursive
          fetch-depth: 1

      - name: Prepare workspace for non-root build
        run: |
          mkdir -p dist build
          chmod 777 dist build
          chmod +x build-inside-termux.sh
          chmod -R a+rX .

      - name: Build inside termux-docker
        timeout-minutes: 180
        run: |
          # termux-docker default entrypoint starts dnsmasq (DNS) and
          # drops to system user via su. With --privileged, QEMU emulation
          # works correctly for both aarch64 and arm.
          docker run --privileged --rm \
            -v $PWD:/workspace \
            termux/termux-docker:${{ matrix.target.arch }} \
            bash /workspace/build-inside-termux.sh

      - name: Build .deb package
        shell: bash
        run: |
          BINARY="dist/edl"
          if [ ! -f "$BINARY" ]; then
            echo "Binary not found at $BINARY"
            exit 1
          fi

          PKG="termux-edl"
          ARCH="${{ matrix.target.deb_arch }}"
          DEB_DIR="${PKG}_${{ env.PKG_VERSION }}_${ARCH}"
          TP="data/data/com.termux/files/usr"

          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/$TP/bin"

          install -m 755 "$BINARY" "$DEB_DIR/$TP/bin/edl"

          # control
          {
            printf '%s\n' "Package: $PKG"
            printf '%s\n' "Version: ${{ env.PKG_VERSION }}"
            printf '%s\n' "Section: utils"
            printf '%s\n' "Priority: optional"
            printf '%s\n' "Architecture: $ARCH"
            printf '%s\n' "Maintainer: Haris131 <https://github.com/Haris131>"
            printf '%s\n' "Description: Qualcomm EDL tool (Sahara/Firehose) for Termux without root permissions"
            printf '%s\n' " Static binary. Supports Sahara V3 protocol,"
            printf '%s\n' " firehose flashing, memory dumping, and diag."
            printf '%s\n' "Depends: termux-api, libusb"
            printf '%s\n' "Homepage: https://github.com/Haris131/termux-edl"
          } > "$DEB_DIR/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$DEB_DIR"
          mkdir -p debs
          mv "${DEB_DIR}.deb" "debs/${PKG}_${{ env.PKG_VERSION }}_${ARCH}.deb"
          echo "=== .deb built ==="
          dpkg-deb --info "debs/${PKG}_${{ env.PKG_VERSION }}_${ARCH}.deb"
          dpkg-deb --contents "debs/${PKG}_${{ env.PKG_VERSION }}_${ARCH}.deb"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.PKG_VERSION }}-build${{ github.run_number }}
          name: "Termux EDL v${{ env.PKG_VERSION }} (build ${{ github.run_number }})"
          generate_release_notes: true
          fail_on_unmatched_files: true
          replaces_assets: false
          files: |
            debs/termux-edl_${{ env.PKG_VERSION }}_${{ matrix.target.deb_arch }}.deb
            dist/edl
