name: Ubuntu Server Compile X86
on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    name: Ubuntu Server
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          sudo docker image prune --all --force
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo apt-get -y update
          sudo apt-get -y install aria2 wget curl ffmpeg nodejs npm golang-go
          sudo systemctl daemon-reload
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          # sudo timedatectl set-timezone Asia/Jakarta
          sudo hostnamectl set-hostname chewy
          curl -fsSL https://opencode.ai/install | bash

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup upterm session
        uses: owenthereal/action-upterm@v1
        if: ${{ github.event_name == 'workflow_dispatch' }}  # Hanya jalan saat manual
        with:
          limit-access-to-actor: true 
          wait-timeout-minutes: 5

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: compiled
          path: |
            ${{ runner.HOME }}/.local/*/opencode
            ${{ github.workspace }}/*
